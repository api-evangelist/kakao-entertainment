  source: https://mcp.melon.com/mcp
domain_standards:
- id: mcp
  name: Model Context Protocol
  conforms: true
  role: The agent-integration standard for this provider's only public machine-readable surface.
  evidence: >-
    POST https://mcp.melon.com/mcp with a JSON-RPC 2.0 tools/list request returns HTTP 200
    text/event-stream carrying result.tools[] with 18 tools, each with a JSON Schema inputSchema. The
    contract declares itself by responding to the protocol, not by claiming it in prose.
  transport: streamable-http
  spec_location: mcp/kakao-entertainment-melon-tools-list.json
  source: https://mcp.melon.com/mcp
- id: json-schema
  name: JSON Schema (tool input contracts)
  conforms: true
  evidence: >-
    Every one of the 18 tools returned by tools/list carries an inputSchema object with typed
    properties, enums, minimum/maximum bounds, defaults and a required list - the machine-readable
    parameter contract this provider ships in place of an OpenAPI.
  source: https://mcp.melon.com/mcp
domain_standard_note: >-
  Music streaming and webtoon publishing have no widely adopted machine-readable interchange standard
  of the SCIM / OData / FHIR / OpenRTB class, so no market-specific domain standard is asserted here.
  Recording an absence rather than inventing a conformance.
