    discovery works only because mcp.melon.com 301s /.well-known/oauth-authorization-server to
    cola.melon.com.
  source: https://mcp.melon.com/.well-known/oauth-protected-resource
- id: rfc9457
  name: Problem Details for HTTP APIs
  conforms: false
  evidence: >-
    No application/problem+json surface was observed. The MCP server returns JSON-RPC 2.0 framing over
