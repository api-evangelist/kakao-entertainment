apis:
- aid: kakao-entertainment:kakao-entertainment-melon-mcp
  name: Melon MCP Server
  description: Melon's first-party remote Model Context Protocol server, published by Kakao Entertainment's
    AI Application Technology team. Streamable HTTP transport at https://mcp.melon.com/mcp, OAuth 2.0
    authenticated, currently beta. An anonymous tools/list call returns 18 tools with full JSON Schema
    input contracts covering music search, official charts, content and artist detail, genre browsing,
    curated and personalized recommendations, the signed-in user's liked/recent/most-listened history
    and playlists, and playback URL generation. Officially supported clients are Claude.ai / Claude Desktop
    and Kakao PlayMCP; OAuth redirect URI allowlisting and client credential issuance are managed by Melon
    on a per-partner allowlist.
  humanURL: https://tech.kakaoent.com/ai/using-melon-mcp-server-en/
