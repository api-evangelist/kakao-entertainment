name: Kakao Entertainment
description: 'Kakao Entertainment Corp. is the South Korean entertainment subsidiary of Kakao Corp., formed
  from the 2021 merger of Kakao Page and Kakao M. It operates three business lines — Story (Kakao Page
  and Kakao Webtoon serialized webtoon and web-novel platforms, plus the overseas Tapas and Radish properties),
  Music (the Melon streaming service and the StarShip, IST, EDAM and Antenna labels), and Media (film,
  drama and artist management). Its public machine-readable API surface is agent-native rather than REST:
  Melon publishes a first-party remote Model Context Protocol (MCP) server at https://mcp.melon.com/mcp,
  in beta, exposing 18 anonymously-introspectable tools for music search, official Melon charts, artist
  and album detail, genre browsing, personalized DJ Mallang recommendations, listening history and playlist/playback
  URL generation. Access is authenticated with OAuth 2.0 against the Melon Alliance Auth v3 platform,
  which publishes RFC 8414 authorization server metadata and an RFC 7591 dynamic client registration endpoint.
  Kakao Entertainment publishes no OpenAPI, no REST developer portal, and no SDKs; the corporate site
  and the Melon consumer properties carry no developer program. Kakao Corp''s general developer platform
  at developers.kakao.com belongs to the parent company and is profiled separately as `kakao`.'
